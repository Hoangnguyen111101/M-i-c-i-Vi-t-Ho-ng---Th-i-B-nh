<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 960" width="1200" height="960">
  <defs>
    <style>
      .stroke-main { stroke: #74263D; stroke-width: 18px; stroke-linecap: round; stroke-linejoin: round; }
      .crease { stroke: #74263D; stroke-width: 17px; stroke-linecap: round; }
    </style>
  </defs>

  <!-- 1. TAILS (BOTTOM RIBBON ENDS WITH SWALLOWTAIL V-CUT) -->
  <g id="tails">
    <!-- Left Tail -->
    <path class="stroke-main" fill="#EA5B83"
      d="M 160 550
         L 55 870
         L 205 770
         L 345 910
         C 385 790 415 670 435 550 Z" />

    <!-- Right Tail -->
    <path class="stroke-main" fill="#EA5B83"
      d="M 1040 550
         L 1145 870
         L 995 770
         L 855 910
         C 815 790 785 670 765 550 Z" />
  </g>

  <!-- 2. BACK SHADED WINGS (DARKER PINK #9E3354) -->
  <g id="back-wings">
    <!-- Left Back Wing -->
    <path class="stroke-main" fill="#9E3354"
      d="M 380 95
         C 230 90 120 120 50 190
         C 20 225 15 285 45 355
         C 75 425 125 450 170 460
         C 120 380 100 280 140 200
         C 180 120 280 95 380 95 Z" />

    <!-- Right Back Wing -->
    <path class="stroke-main" fill="#9E3354"
      d="M 820 95
         C 970 90 1080 120 1150 190
         C 1180 225 1185 285 1155 355
         C 1125 425 1075 450 1030 460
         C 1080 380 1100 280 1060 200
         C 1020 120 920 95 820 95 Z" />
  </g>

  <!-- 3. FRONT MAIN LOOPS -->
  <g id="front-loops">
    <!-- Left Front Loop -->
    <path class="stroke-main" fill="#EA5B83"
      d="M 530 325
         C 420 140 310 40 180 45
         C 75 50 25 130 30 240
         C 35 350 70 430 40 530
         C 20 600 45 680 120 735
         C 210 800 360 760 460 670
         C 505 630 525 570 530 500 Z" />

    <!-- Right Front Loop -->
    <path class="stroke-main" fill="#EA5B83"
      d="M 670 325
         C 780 140 890 40 1020 45
         C 1125 50 1175 130 1170 240
         C 1165 350 1130 430 1160 530
         C 1180 600 1155 680 1080 735
         C 990 800 840 760 740 670
         C 695 630 675 570 670 500 Z" />
  </g>

  <!-- 4. BOTTOM FOLD LIP (LIGHT BLUSH PINK CUFF) -->
  <g id="bottom-cuffs">
    <!-- Left Cuff -->
    <path class="stroke-main" fill="#F794B2"
      d="M 75 640
         C 110 730 220 780 330 770
         C 420 760 490 700 530 645
         C 530 500 525 500 525 500
         C 460 620 350 685 240 685
         C 160 685 105 655 75 640 Z" />

    <!-- Right Cuff -->
    <path class="stroke-main" fill="#F794B2"
      d="M 1125 640
         C 1090 730 980 780 870 770
         C 780 760 710 700 670 645
         C 670 500 675 500 675 500
         C 740 620 850 685 960 685
         C 1040 685 1095 655 1125 640 Z" />
  </g>

  <!-- 5. THREE CREASE LINES ON EACH SIDE -->
  <g id="creases">
    <!-- Left Creases -->
    <path class="crease" d="M 510 355 C 410 310 320 270 250 245" />
    <path class="crease" d="M 515 425 C 420 440 340 455 265 470" />
    <path class="crease" d="M 505 485 C 430 535 355 585 285 625" />

    <!-- Right Creases -->
    <path class="crease" d="M 690 355 C 790 310 880 270 950 245" />
    <path class="crease" d="M 685 425 C 780 440 860 455 935 470" />
    <path class="crease" d="M 695 485 C 770 535 845 585 915 625" />
  </g>

  <!-- 6. CENTER KNOT -->
  <g id="knot">
    <!-- Main Knot Rectangle -->
    <rect class="stroke-main" fill="#EA5B83"
      x="528" y="315" width="144" height="190" rx="36" ry="36" />

    <!-- Inner Lighter Pink Pill Highlight -->
    <rect fill="#F794B2"
      x="552" y="335" width="96" height="150" rx="24" ry="24" />
  </g>
</svg>